name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'android-v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/PhotoTrans-v1.0.0.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          echo "Creating release for tag: $TAG"
          # Create release via GitHub API
          API_JSON=$(printf '{"tag_name":"%s","target_commitish":"main","name":"%s","body":"PhotoTrans Android APK - %s","draft":false,"prerelease":false}' "$TAG" "$TAG" "$TAG")
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$API_JSON")
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "Release ID: $RELEASE_ID"
          # Upload APK as release asset
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/vnd.debian.binary-package" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=PhotoTrans-v1.0.0.apk" \
            --data-binary @app/build/outputs/apk/debug/PhotoTrans-v1.0.0.apk

      - name: Upload APK artifact
        if: "!startsWith(github.ref, 'refs/tags/android-v')"
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTrans-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90